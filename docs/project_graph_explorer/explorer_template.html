<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSBI Project Explorer</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --text:#1b2333; --muted:#5f6b7d; --border:#dde2ea; --accent:#1f4e79;
  --edge:#9aa5b5; --up:#d9822b; --down:#2f80d1; --sel:#e0393e; --chip:#eef2f8; --canvas:#fbfcfe;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181f; --panel:#1c222c; --text:#e3e8f0; --muted:#97a3b6; --border:#2f3846; --accent:#7fb2e5;
         --edge:#5d6878; --up:#f0a050; --down:#5aa7f0; --sel:#ff6b6b; --chip:#263040; --canvas:#171c24; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0 8px 0 0;color:var(--accent);white-space:nowrap}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button,.tool{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:6px;padding:6px 11px;cursor:pointer;font:inherit}
.views button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.views button:hover,.tool:hover{border-color:var(--accent)}
.opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:4px;align-items:center;cursor:pointer}
#search{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;padding:6px 10px;width:200px;font:inherit}
main{display:grid;grid-template-columns:250px 1fr 340px;height:calc(100% - 56px)}
aside{background:var(--panel);overflow:auto;padding:10px 12px}
#left{border-right:1px solid var(--border)}
#right{border-left:1px solid var(--border)}
#center{position:relative;overflow:hidden;background:var(--canvas)}
#hint{position:absolute;left:10px;top:8px;right:10px;font-size:12.5px;color:var(--muted);pointer-events:none}
#legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);max-width:75%;background:color-mix(in srgb,var(--canvas) 85%,transparent);padding:4px 6px;border-radius:6px}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid}
#zoombar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
svg{width:100%;height:100%;display:block;cursor:grab}
svg.dragging{cursor:grabbing}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3;opacity:.75}
.edge.state{stroke-dasharray:5 4}
.edge.fw{stroke-dasharray:2 4}
.edge.back{stroke-dasharray:6 3}
.edge.up{stroke:var(--up);stroke-width:2.4;opacity:1}
.edge.down{stroke:var(--down);stroke-width:2.4;opacity:1}
.elabel{font-size:10.5px;fill:var(--muted);display:none}
.elabel.show{display:block}
.elabel.up{fill:var(--up)} .elabel.down{fill:var(--down)}
.node{cursor:pointer}
.node rect{stroke-width:1.6}
.node text{fill:var(--text);font-size:12.5px;pointer-events:none}
.node text.sub{fill:var(--muted);font-size:10.5px}
.node.kind-callback rect{stroke-width:3}
.node.kind-ext rect,.node.kind-runtime rect{stroke-dasharray:4 3}
.node.kind-data rect,.node.kind-script rect{stroke-width:2.6}
.node.match rect{stroke:var(--sel)!important;stroke-width:3}
.node rect.bar{stroke:none!important}
.node.sel rect{stroke:var(--sel)!important;stroke-width:3.5}
.node.upn rect{stroke:var(--up)!important;stroke-width:2.6}
.node.downn rect{stroke:var(--down)!important;stroke-width:2.6}
.dim{opacity:.13}
.tree-link{fill:none;stroke:var(--edge);stroke-width:1.2}
/* left tree */
.ftree,.ftree ul{list-style:none;margin:0;padding-left:14px}
.ftree{padding-left:0}
.ftree li{margin:1px 0;white-space:nowrap}
.ftree .f{cursor:pointer;padding:1px 5px;border-radius:4px;display:inline-block}
.ftree .f:hover{background:var(--chip)}
.ftree .f.active{background:var(--accent);color:#fff}
.ftree .dir{font-weight:600;cursor:pointer}
.ftree .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.ftree .meta{color:var(--muted);font-size:11px;margin-left:4px}
h2{font-size:14px;margin:4px 0 8px;color:var(--accent)}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
#details code,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
#details .sig{background:var(--chip);padding:6px 8px;border-radius:6px;word-break:break-word}
#details table{width:100%;border-collapse:collapse;font-size:12.5px}
#details td,#details th{border-bottom:1px solid var(--border);padding:4px 4px;text-align:left;vertical-align:top}
#details th{color:var(--muted);font-weight:600}
#details a{color:var(--accent);cursor:pointer;text-decoration:none}
#details a:hover{text-decoration:underline}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--chip);margin:1px 3px 1px 0}
.pill.in{background:color-mix(in srgb,var(--up) 22%,transparent)}
.pill.out{background:color-mix(in srgb,var(--down) 22%,transparent)}
.muted{color:var(--muted)}
.foot{font-size:11px;color:var(--muted);margin-top:16px}
@media (max-width:1000px){main{grid-template-columns:1fr;grid-template-rows:200px 60vh auto;height:auto}#left,#right{border:none}}
</style>
</head>
<body>
<header>
  <h1>NSBI web app – project explorer</h1>
  <div class="views" id="views">
    <button data-view="structure" class="active">Folder &amp; file structure</button>
    <button data-view="imports">Module imports</button>
    <button data-view="calls">Function calls</button>
    <button data-view="callbacks">Callback data flow (inputs → outputs)</button>
  </div>
  <div class="opts" id="opts"></div>
  <input id="search" type="search" placeholder="Search nodes… (Enter = focus)">
</header>
<main>
  <aside id="left"><h2>Files</h2><div id="ftree"></div></aside>
  <section id="center">
    <svg id="svg"><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--edge)"/></marker>
      <marker id="arr-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--up)"/></marker>
      <marker id="arr-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--down)"/></marker>
    </defs><g id="vp"></g></svg>
    <div id="hint"></div>
    <div id="legend"></div>
    <div id="zoombar"><button class="tool" id="fit">Fit</button><button class="tool" id="zin">+</button><button class="tool" id="zout">−</button></div>
  </section>
  <aside id="right"><div id="details"></div></aside>
</main>
<script>
const DATA = /*__DATA__*/null;

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const PALETTE = ["#2f80d1","#d9822b","#2e9e6a","#a04fc4","#c4473b","#1f9fae","#b58b12","#6a7bd8","#c2508d","#5b8c3a","#8c6d4f","#4a6b8a"];
const fileColor = {};
(() => { let i = 0;
  const rank = p => p.endsWith(".py") ? (p.startsWith("app") ? 0 : 1) : 2;
  const order = DATA.files.map(f => f.path).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  for (const p of order) fileColor[p] = PALETTE[i++ % PALETTE.length]; })();
const KIND_COLOR = {ext:"#8a94a6", runtime:"#8a94a6", data:"#2e9e6a", script:"#b58b12", dir:"#6b7a90"};
const colorOf = n => n.color || (n.file && fileColor[n.file]) || KIND_COLOR[n.kind] || "#6b7a90";
const fnById = Object.fromEntries(DATA.functions.map(f => [f.id, f]));
const compById = Object.fromEntries(DATA.components.map(c => [c.id, c]));
const extByName = Object.fromEntries(DATA.external.map(e => [e.name, e]));
const shortFile = p => p.split("/").pop();
const measureCtx = document.createElement("canvas").getContext("2d");
function textW(t, size = 12.5) { measureCtx.font = `${size}px "Segoe UI", system-ui, sans-serif`; return measureCtx.measureText(t).width; }

/* ------------------------------------------------------------------ state */
const S = { view: "structure", sel: null, selFile: null, chain: "full",
  opt: { functions: true, external: false, runtime: false, helpers: false, labels: true, docs: !!DATA.include_docs_default } };
const isTool = path => !!path && (DATA.tooling_prefixes || []).some(p => path.startsWith(p));
const vis = path => S.opt.docs || !isTool(path);              // is this file's code shown?
const extVisible = e => e.used_by.some(vis);
let G = null;          // current graph {nodes, edges, map}
let T = {k: 1, x: 0, y: 0};

/* ------------------------------------------------------------------ graph builders */
function addNode(g, n) { if (!g.map[n.id]) { g.map[n.id] = n; g.nodes.push(n); } return g.map[n.id]; }
function addEdge(g, e) {
  const key = e.source + ">" + e.target + ">" + (e.label || "") + ">" + (e.kind || "");
  if (!g.map[e.source] || !g.map[e.target]) return;
  if (g.ekeys.has(key)) { g.ekeys.get(key).count++; return; }
  e.count = 1; g.ekeys.set(key, e); g.edges.push(e);
}
const newGraph = () => ({nodes: [], edges: [], map: {}, ekeys: new Map()});

function funcNode(f) {
  const kind = f.kind === "callback" ? "callback" : f.kind === "module" ? "module" : f.kind === "class" ? "class" : "func";
  const label = f.kind === "module" ? `${shortFile(f.file)} · module level` : f.qualname + (f.kind === "class" ? "" : "()");
  const sub = f.kind === "callback" ? `callback · ${f.file}` : f.tooling ? `${f.file} · tooling` : f.file;
  return {id: f.id, label, sub, kind, file: f.file};
}

function buildStructure() {
  const g = newGraph(); g.tree = true;
  const rootName = DATA.root.split(/[\\/]/).pop();
  function walk(node, parentId, depth) {
    const id = node.type === "dir" ? "dir:" + node.path : "file:" + node.path;
    const n = addNode(g, node.type === "dir"
      ? {id, label: depth === 0 ? rootName : node.name + "/", sub: depth === 0 ? "project root" : "folder", kind: "dir"}
      : {id, label: node.name, sub: node.lines != null ? `${node.lines} lines` : `${(node.size/1024).toFixed(1)} kB`,
         kind: node.path.startsWith("data/") && node.ext !== ".md" ? "data" : "file", file: node.path});
    n.depth = depth; n.parent = parentId; n.children = [];
    if (parentId) g.map[parentId].children.push(id);
    if (node.type === "dir") node.children.forEach(c => walk(c, id, depth + 1));
    else if (S.opt.functions && DATA.file_info[node.path] && vis(node.path)) {
      DATA.functions.filter(f => f.file === node.path && !f.parent && f.kind !== "module").forEach(f => {
        const fn = addNode(g, {...funcNode(f), sub: f.kind === "callback" ? "callback" : f.kind === "class" ? "class" : `line ${f.line}`});
        fn.depth = depth + 1; fn.parent = id; fn.children = []; n.children.push(fn.id);
      });
    }
  }
  walk(DATA.tree, null, 0);
  g.nodes.forEach(n => { if (n.parent) g.edges.push({source: n.parent, target: n.id, kind: "tree", count: 1}); });
  return g;
}

function buildImports() {
  const g = newGraph();
  for (const f of DATA.files) {
    if ((f.ext === ".py" && vis(f.path)) || f.path.startsWith("assets/")) addNode(g, {id: "file:" + f.path, label: f.name, sub: isTool(f.path) ? f.path + " · tooling" : f.path, kind: "file", file: f.path});
  }
  for (const d of DATA.data_files) addNode(g, {id: d.id, label: shortFile(d.path), sub: "data file", kind: "data", file: d.path});
  for (const w of DATA.writers) addNode(g, {id: w.id, label: shortFile(w.path), sub: "external script", kind: "script"});
  if (S.opt.external) for (const e of DATA.external) if (extVisible(e)) addNode(g, {id: "ext:" + e.name, label: e.name, sub: "external library", kind: "ext"});
  for (const i of DATA.imports) addEdge(g, {source: i.source, target: i.target, label: i.names.join(", "), kind: "import"});
  for (const f of DATA.framework) addEdge(g, {source: f.source, target: f.target, label: f.label, kind: "fw"});
  for (const r of DATA.data_reads) { const fn = fnById[r.target]; addEdge(g, {source: r.source, target: "file:" + fn.file, label: "read by " + fn.qualname + "()", kind: "data"}); }
  for (const w of DATA.writers) for (const t of w.targets) addEdge(g, {source: w.id, target: t, label: "writes", kind: "data"});
  return g;
}

function buildCalls() {
  const g = newGraph();
  for (const f of DATA.functions) if (vis(f.file)) addNode(g, funcNode(f));
  for (const d of DATA.data_files) addNode(g, {id: d.id, label: shortFile(d.path), sub: "data file", kind: "data", file: d.path});
  for (const w of DATA.writers) addNode(g, {id: w.id, label: shortFile(w.path), sub: "external script", kind: "script"});
  if (S.opt.external) for (const e of DATA.external) if (extVisible(e)) addNode(g, {id: "ext:" + e.name, label: e.name, sub: "external library", kind: "ext"});
  if (S.opt.runtime) {
    addNode(g, {id: "runtime", label: "Dash runtime", sub: "calls layouts & callbacks", kind: "runtime"});
    for (const f of DATA.functions) {
      if (f.kind === "callback") addEdge(g, {source: "runtime", target: f.id, label: "triggers on Input change", kind: "fw"});
      if (f.qualname === "layout" && DATA.file_info[f.file]?.page) addEdge(g, {source: "runtime", target: f.id, label: "page load", kind: "fw"});
    }
  }
  for (const c of DATA.calls) addEdge(g, {source: c.source, target: c.target, label: c.kind === "ext" ? c.name.split(".").slice(-1)[0] + "()" : "", kind: c.kind});
  for (const r of DATA.data_reads) addEdge(g, {source: r.source, target: r.target, label: "read_excel", kind: "data"});
  for (const w of DATA.writers) for (const t of w.targets) addEdge(g, {source: w.id, target: t, label: "writes", kind: "data"});
  // drop isolated <module level> nodes that call nothing shown
  return pruneIsolated(g, n => n.kind === "module");
}

function pruneIsolated(g, pred) {
  const deg = {}; g.edges.forEach(e => { deg[e.source] = (deg[e.source] || 0) + 1; deg[e.target] = (deg[e.target] || 0) + 1; });
  g.nodes = g.nodes.filter(n => !(pred(n) && !deg[n.id]));
  g.map = Object.fromEntries(g.nodes.map(n => [n.id, n])); return g;
}

function buildCallbacks() {
  const g = newGraph();
  for (const cb of DATA.callbacks) {
    const f = fnById[cb.id];
    addNode(g, {...funcNode(f), label: f.qualname + "()", sub: "callback · " + shortFile(f.file)});
  }
  for (const c of DATA.components) {
    const def = c.defs[0];
    const file = def ? def.file : (DATA.callbacks.find(cb => cb.deps.some(d => d.id === c.id))?.file);
    const type = def ? def.type.replace(/^(dcc|html|dag)\./, "") : "component";
    addNode(g, {id: "comp:" + c.id, label: "#" + c.id, sub: type, kind: "component", file});
  }
  for (const cb of DATA.callbacks) for (const d of cb.deps) {
    if (d.kind === "output") addEdge(g, {source: cb.id, target: "comp:" + d.id, label: d.prop, kind: "output"});
    else addEdge(g, {source: "comp:" + d.id, target: cb.id, label: d.prop, kind: d.kind});
  }
  if (S.opt.helpers) {
    const seen = new Set(), stack = DATA.callbacks.map(c => c.id);
    while (stack.length) { const id = stack.pop(); if (seen.has(id)) continue; seen.add(id);
      for (const c of DATA.calls) if (c.source === id && c.kind === "call") {
        addNode(g, funcNode(fnById[c.target])); addEdge(g, {source: id, target: c.target, label: "calls", kind: "call"}); stack.push(c.target); }
    }
    for (const r of DATA.data_reads) if (g.map[r.target]) { addNode(g, {id: r.source, label: shortFile(r.source), sub: "data file", kind: "data"}); addEdge(g, {source: r.source, target: r.target, label: "read_excel", kind: "data"}); }
  }
  return g;
}

/* ------------------------------------------------------------------ layouts */
const NODE_H = 40, GAP_Y = 14, GAP_X = 90;
function sizeNodes(g) { for (const n of g.nodes) { n.w = Math.max(textW(n.label, 12.5), textW(n.sub || "", 10.5)) + 26; n.h = NODE_H; } }

function treeLayout(g) {
  sizeNodes(g);
  const depthW = {}; g.nodes.forEach(n => depthW[n.depth] = Math.max(depthW[n.depth] || 0, n.w));
  const depthX = {}; let x = 0; Object.keys(depthW).map(Number).sort((a, b) => a - b).forEach(d => { depthX[d] = x; x += depthW[d] + 60; });
  let y = 0;
  function place(id) { const n = g.map[id];
    n.x = depthX[n.depth];
    if (!n.children.length) { n.y = y; y += n.h + 8; }
    else { n.children.forEach(place); const ys = n.children.map(c => g.map[c].y); n.y = (Math.min(...ys) + Math.max(...ys)) / 2; } }
  place(g.nodes[0].id);
}

function layeredLayout(g) {
  sizeNodes(g);
  // split into weakly connected parts, lay each out separately and stack them vertically
  const adj = {}; g.nodes.forEach(n => adj[n.id] = []);
  g.edges.forEach(e => { adj[e.source].push(e.target); adj[e.target].push(e.source); });
  const seen = new Set(), parts = [];
  for (const n of g.nodes) { if (seen.has(n.id)) continue; const comp = [], st = [n.id]; seen.add(n.id);
    while (st.length) { const u = st.pop(); comp.push(u); for (const v of adj[u]) if (!seen.has(v)) { seen.add(v); st.push(v); } }
    parts.push(comp); }
  parts.sort((a, b) => b.length - a.length);
  const singles = parts.filter(p => p.length === 1).flat(), multi = parts.filter(p => p.length > 1);
  let yOff = 0;
  for (const comp of multi) {
    const set = new Set(comp);
    layeredCore({nodes: comp.map(id => g.map[id]), edges: g.edges.filter(e => set.has(e.source)), map: g.map});
    const minY = Math.min(...comp.map(id => g.map[id].y)), maxY = Math.max(...comp.map(id => g.map[id].y + g.map[id].h));
    comp.forEach(id => g.map[id].y += yOff - minY); yOff += maxY - minY + 70;
  }
  if (singles.length) { let x = 0; const maxW = 1400;
    let rowY = yOff; singles.forEach(id => { const n = g.map[id]; if (x + n.w > maxW) { x = 0; rowY += NODE_H + GAP_Y; }
      n.x = x; n.y = rowY; n.layer = -1; x += n.w + 20; }); }
}

function layeredCore(g) {
  const ids = g.nodes.map(n => n.id), succ = {}, pred = {};
  ids.forEach(i => { succ[i] = new Set(); pred[i] = new Set(); });
  g.edges.forEach(e => { if (e.source !== e.target) { succ[e.source].add(e.target); pred[e.target].add(e.source); } });
  // cycle removal (DFS back edges)
  const st = {}, back = new Set();
  const dfs = u => { st[u] = 1; for (const v of succ[u]) { if (st[v] === 1) back.add(u + ">" + v); else if (!st[v]) dfs(v); } st[u] = 2; };
  ids.filter(i => !pred[i].size).forEach(i => !st[i] && dfs(i)); ids.forEach(i => !st[i] && dfs(i));
  const fs = {}, fp = {}; ids.forEach(i => { fs[i] = [...succ[i]].filter(v => !back.has(i + ">" + v)); fp[i] = []; });
  ids.forEach(i => fs[i].forEach(v => fp[v].push(i)));
  g.edges.forEach(e => e.back = back.has(e.source + ">" + e.target));
  // longest-path layering (Kahn)
  const indeg = {}, layer = {}; ids.forEach(i => { indeg[i] = fp[i].length; layer[i] = 0; });
  const q = ids.filter(i => !indeg[i]), topo = [];
  while (q.length) { const u = q.shift(); topo.push(u); for (const v of fs[u]) { layer[v] = Math.max(layer[v], layer[u] + 1); if (!--indeg[v]) q.push(v); } }
  // pull nodes without predecessors next to their first successor
  for (const u of [...topo].reverse()) if (!fp[u].length && fs[u].length) layer[u] = Math.min(...fs[u].map(v => layer[v])) - 1;
  const minL = Math.min(...ids.map(i => layer[i])); ids.forEach(i => layer[i] -= minL);
  const L = Math.max(...ids.map(i => layer[i])) + 1;
  const layers = Array.from({length: L}, () => []);
  g.nodes.slice().sort((a, b) => (a.file || a.kind).localeCompare(b.file || b.kind) || a.label.localeCompare(b.label))
    .forEach(n => layers[layer[n.id]].push(n.id));
  const pos = {}; const setPos = () => layers.forEach(l => l.forEach((id, i) => pos[id] = i - l.length / 2));
  setPos();
  for (let it = 0; it < 16; it++) {
    const down = it % 2 === 0, seq = down ? [...Array(L).keys()] : [...Array(L).keys()].reverse();
    for (const l of seq) {
      const bc = {}; for (const id of layers[l]) {
        const nb = down ? fp[id] : fs[id]; bc[id] = nb.length ? nb.reduce((s, v) => s + pos[v], 0) / nb.length : pos[id]; }

function renderLegend() {
  const files = [...new Set(G.nodes.map(n => n.file).filter(f => f && fileColor[f] && f.endsWith(".py")))].sort();
  let h = files.map(f => `<span><i style="border-color:${fileColor[f]};background:color-mix(in srgb,${fileColor[f]} 14%,var(--panel))"></i>${esc(f)}</span>`).join("");
  if (S.view === "callbacks") h += `<span><i style="border-radius:8px;border-color:var(--muted)"></i>component</span><span><i style="border-width:3px;border-color:var(--muted)"></i>callback</span><span>— — State</span>`;
  if (S.view !== "structure") h += `<span style="color:var(--up)">■ upstream</span><span style="color:var(--down)">■ downstream</span>`;
  $("#legend").innerHTML = h;
}
function renderHint() { $("#hint").textContent = HINTS[S.view]; }
function setView(v) {
  S.view = v; S.sel = null; S.selFile = null;
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  renderOpts(); render();
  history.replaceState(null, "", "#view=" + v);
}
document.querySelectorAll("#views button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("#search").addEventListener("input", e => { const q = e.target.value.trim().toLowerCase();
  G.nodes.forEach(n => n.g.classList.toggle("match", !!q && (n.label + " " + (n.sub || "")).toLowerCase().includes(q))); });
$("#search").addEventListener("keydown", e => { if (e.key !== "Enter") return; const q = e.target.value.trim().toLowerCase();
  const n = G.nodes.find(n => (n.label + " " + (n.sub || "")).toLowerCase().includes(q)); if (n) { S.sel = null; select(n.id); centerOn(n); } });

/* ------------------------------------------------------------------ pan & zoom */
function applyT() { vp.setAttribute("transform", `translate(${T.x},${T.y}) scale(${T.k})`); }
function fit() {
  const b = vp.getBBox(), W = svg.clientWidth, H = svg.clientHeight; if (!b.width) return;
  T.k = Math.min(1.4, Math.min((W - 40) / b.width, (H - 90) / b.height)); T.x = (W - b.width * T.k) / 2 - b.x * T.k; T.y = (H - b.height * T.k) / 2 - b.y * T.k + 10; applyT();
}
function centerOn(n) { const W = svg.clientWidth, H = svg.clientHeight; T.k = Math.max(T.k, 0.8);
  T.x = W / 2 - (n.x + n.w / 2) * T.k; T.y = H / 2 - (n.y + n.h / 2) * T.k; applyT(); }
function zoomAt(f, cx, cy) { const k = Math.max(0.08, Math.min(4, T.k * f)); T.x = cx - (cx - T.x) * (k / T.k); T.y = cy - (cy - T.y) * (k / T.k); T.k = k; applyT(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
let drag = null, moved = false;
svg.addEventListener("mousedown", e => { drag = {x: e.clientX, y: e.clientY, tx: T.x, ty: T.y}; moved = false; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; T.x = drag.tx + dx; T.y = drag.ty + dy; applyT(); });
window.addEventListener("mouseup", () => { drag = null; svg.classList.remove("dragging"); setTimeout(() => moved = false, 0); });
$("#fit").addEventListener("click", fit);
$("#zin").addEventListener("click", () => zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2));
$("#zout").addEventListener("click", () => zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2));
window.addEventListener("resize", fit);

renderFileTree();
(() => { const h = new URLSearchParams(location.hash.slice(1)); const v = h.get("view");
  if (v && VIEW_OPTS[v]) { S.view = v; document.querySelectorAll("#views button").forEach(b => b.classList.toggle("active", b.dataset.view === v)); }
  renderOpts(); render(); showOverview();
  const sel = h.get("sel"); if (sel) goTo(sel); })();
</script>
</body>
